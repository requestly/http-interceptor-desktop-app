# TEMPORARY (RQ-9421, unit B1): proves that install.sh, build and an unsigned package still work on
# all three platforms after the build-tool updates, and that the packaged app is byte-identical to
# master's except where expected. The release workflow only runs on master, so it can't test a pull
# request. Delete this file before merging.
name: PR build check (temporary, RQ-9421)

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]
        side: [base, head]
    runs-on: ${{ matrix.os }}
    steps:
      - name: EOL autocrlf input
        run: git config --global core.autocrlf input

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install (same script as the release workflow)
        shell: bash
        env:
          # npm runs dependency scripts silently by default. Print their headers so the
          # next step can see one that ran. It runs nothing: ignore-scripts=true still applies.
          npm_config_foreground_scripts: "true"
        run: bash ./install.sh 2>&1 | tee install.log

      - name: Only this repo's own install scripts ran
        shell: bash
        run: |
          # With foreground scripts, npm prints "> <name>@<version> <script>" for every lifecycle script it runs.
          grep -E '^> [^ ]+@[^ ]+ (preinstall|install|postinstall)$' install.log | tee ran.txt || true
          if grep -vE '^> requestly@' ran.txt; then echo "A third-party install script ran"; exit 1; fi

      - name: Build
        run: npm run build

      - name: Package (unsigned, no publish)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --no-install electron-builder build --publish never --dir -c.mac.identity=null -c.mac.notarize=false

      - name: Hash every packaged file, including inside app.asar
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/hash.js" <<'JS'
          const fs = require("fs"), path = require("path"), crypto = require("crypto"), os = require("os");
          const asar = require(path.resolve("node_modules/@electron/asar"));
          const [root, out] = process.argv.slice(2);
          const lines = [];
          const sha = (b) => crypto.createHash("sha256").update(b).digest("hex");
          const walk = (dir, rel, prefix) => {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name), r = rel ? `${rel}/${e.name}` : e.name;
              if (e.isDirectory()) walk(p, r, prefix);
              else if (e.isFile() && e.name === "app.asar" && prefix === "app") {
                const x = fs.mkdtempSync(path.join(os.tmpdir(), "asar-"));
                asar.extractAll(p, x);
                walk(x, "", "asar");
              } else if (e.isFile()) lines.push(`${sha(fs.readFileSync(p))}  ${prefix}/${r}`);
            }
          };
          walk(root, "", "app");
          lines.sort((a, b) => a.slice(66).localeCompare(b.slice(66)));
          fs.writeFileSync(out, lines.join("\n") + "\n");
          console.log(`${lines.length} files hashed from ${root}`);
          JS
          dir=$(find release/build -maxdepth 1 -mindepth 1 -type d \( -name '*-unpacked' -o -name 'mac*' \) | head -1)
          node "$RUNNER_TEMP/hash.js" "$dir" "manifest-${{ matrix.os }}-${{ matrix.side }}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-${{ matrix.os }}-${{ matrix.side }}
          path: manifest-${{ matrix.os }}-${{ matrix.side }}.txt

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: manifest-*
          merge-multiple: true

      - name: Packaged files that differ from master, per platform
        shell: bash
        run: |
          python3 - <<'PY'
          def load(f):
              return {l[66:]: l[:64] for l in open(f, encoding="utf-8").read().splitlines() if l}
          for os_ in ["macos-latest", "windows-2022", "ubuntu-latest"]:
              b, h = load(f"manifest-{os_}-base.txt"), load(f"manifest-{os_}-head.txt")
              changed = sorted(p for p in b.keys() & h.keys() if b[p] != h[p])
              print(f"== {os_}: {len(b)} files on master, {len(h)} on this PR, {len(changed)} changed")
              for p in sorted(b.keys() - h.keys()): print(f"   only on master: {p}")
              for p in sorted(h.keys() - b.keys()): print(f"   only on PR: {p}")
              for p in changed: print(f"   changed: {p}")
          PY
